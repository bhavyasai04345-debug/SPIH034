<!DOCTYPE html>
<html>
<head>
  <title>RiskRadar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">RiskRadar</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container text-center mt-5">
    <h1>RiskRadar</h1>
    <p class="lead">AI‑Driven Predictive Safety System</p>
    <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" class="form-control mb-3" required>
      <button type="submit" class="btn btn-primary">Upload & Analyze</button>
    </form>
  </div>

  <!-- Features Section -->
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <h3>Risk Classification</h3>
          <p>Low/Medium/High with plain‑language explanations.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <h3>Explainable AI</h3>
          <p>SHAP/LIME to show why risks are flagged.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <h3>Recommendations</h3>
          <p>Inspect / Calibrate / Replace / Monitor.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
